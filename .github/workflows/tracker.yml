name: Sitemap tracker

on:
  schedule:
    - cron: "45 0-17 * * *"   # :15 IST, 06:15–23:15
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read sitemaps
        run: |
          if [ -f scripts/tracker.py ]; then python scripts/tracker.py; else python tracker.py; fi
      - name: Commit data
        if: always()
        run: |
          mkdir -p data
          git config user.name "patrika-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "tracker: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git pull --rebase --quiet
            git push
          fi
